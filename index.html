<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>É o Rivi</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#000;
    display:flex;
    justify-content:center;
    padding:40px 15px;
}

.container{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:22px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.profile{
    width:140px;
    height:140px;
    border-radius:50%;
    border:3px solid #000;
    display:block;
    margin:auto;
    object-fit:cover;
}

h1{
    text-align:center;
    margin-top:18px;
    font-size:30px;
}

h2{
    text-align:center;
    font-weight:400;
    color:#555;
    margin-bottom:30px;
}

.section{
    margin-top:35px;
    padding-top:30px;
    border-top:2px solid #ececec;
}

.section:first-of-type{
    border:none;
    margin-top:10px;
    padding-top:0;
}

.section-title{
    text-align:center;
    font-size:23px;
    font-weight:bold;
    letter-spacing:1px;
}

.section-price{
    text-align:center;
    font-size:18px;
    margin:8px 0 20px;
    color:#444;
}

.gallery{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.gallery img{
    width:100%;
    border-radius:18px;
    transition:.25s;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.gallery img:hover{
    transform:scale(1.02);
}

.maintenance{
    width:100%;
    height:220px;
    border-radius:18px;
    background:#efefef;
    position:relative;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.maintenance::before,
.maintenance::after{
    content:"";
    position:absolute;
    width:180%;
    height:45px;
    left:-40%;
    background:repeating-linear-gradient(
        45deg,
        #ffd500 0px,
        #ffd500 25px,
        #111 25px,
        #111 50px
    );
}

.maintenance::before{
    top:65px;
    transform:rotate(-8deg);
}

.maintenance::after{
    top:120px;
    transform:rotate(8deg);
}

.maintenance span{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#111;
    color:#fff;
    padding:10px 20px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    z-index:2;
}

footer{
    margin-top:35px;
    text-align:center;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<main class="container">

<img class="profile" src="./perfil.png" alt="Perfil">

<h1>É o Rivi</h1>
<h2>Tabela de Preços</h2>

<section class="section">

<div class="section-title">
Thumb
</div>

<div class="section-price">
R$ 15
</div>

<div class="gallery">

<img src="./imagem1.png">

<img src="./imagem2.png">

<img src="./imagem3.jpg">

<img src="https://sourivi.github.io/imagem4.png">

<img src="./imagem5.png">

</div>

</section>

<section class="section">

    <div class="section-title">
        Ilustrações
    </div>

    <div class="section-price">
        R$ 15
    </div>

    <div class="maintenance">
        <span>EM MANUTENÇÃO</span>
    </div>

</section>

<footer>
    © 2026 • É o Rivi
</footer>

</main>

</body>
          </html>
